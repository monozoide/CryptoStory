[tool.poetry]
name = "cryptostory"
version = "0.1.0"
description = "A Python platform for collecting OHLCV crypto data from Binance with a TUI, PostgreSQL, and Systemd automation."
authors = ["Jules"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pytest = "^8.0.0"
httpx = "^0.26.0"
textual = "^0.50.1"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.1"
asyncpg = "^0.29.0"
sqlalchemy-utils = "^0.41.1"
pytest-asyncio = "^0.23.3"


[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
ruff = "^0.1.15"
mypy = "^1.8.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
